<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Airport Status - concept 2: Radar arc A</title>
  <rect width="1024" height="1024" fill="#0B0B0D"/>
  <!-- the A: two legs meeting at a rounded apex -->
  <path d="M222 800 L512 236 L802 800" fill="none" stroke="#F4F4F6" stroke-width="124" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- radar ping: arc rising from the airport dot, doubling as the crossbar -->
  <path d="M320.5 669.3 A250 250 0 0 1 703.5 669.3" fill="none" stroke="#FF5A36" stroke-width="56" stroke-linecap="round"/>
  <circle cx="512" cy="830" r="46" fill="#FF5A36"/>
</svg>
