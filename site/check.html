<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Checks · Airports</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<style>
:root {
  color-scheme: dark light;
  --bg: #000; --card: #1c1c1e; --card-2: #2c2c2e; --text: #fff; --muted: #8e8e93; --line: rgba(255,255,255,.1);
  --ok: #30d158; --warn: #ffb020; --fail: #ff453a; --info: #2ec4d6;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f2f2f7; --card: #fff; --card-2: #f2f2f7; --text: #000; --muted: #6c6c70; --line: rgba(0,0,0,.1);
    --ok: #1f9d43; --warn: #b86e00; --fail: #d70015; --info: #0f8da0; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 720px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px 40px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
button, .btn { font: inherit; font-size: 14px; font-weight: 600; color: var(--text); background: var(--card); border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer; text-decoration: none; }
.summary { border-radius: 16px; padding: 14px 16px; margin: 6px 0 14px; background: var(--card); font-size: 18px; font-weight: 800; border-left: 6px solid var(--muted); }
.summary.pass { border-color: var(--ok); } .summary.fail { border-color: var(--fail); } .summary.warn { border-color: var(--warn); }
h2 { margin: 22px 4px 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.group { background: var(--card); border-radius: 16px; overflow: hidden; }
.row { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 10px 14px; align-items: start; }
.row + .row { border-top: 1px solid var(--line); }
.st { font-size: 11px; font-weight: 800; letter-spacing: .06em; border-radius: 6px; padding: 3px 0; text-align: center; color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
.st.pass { --c: var(--ok); } .st.warn { --c: var(--warn); } .st.fail { --c: var(--fail); } .st.info { --c: var(--info); }
.lbl { font-weight: 600; }
.det { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
pre#result { white-space: pre-wrap; font: 12px/1.45 var(--mono); background: var(--card); border-radius: 14px; padding: 12px; margin-top: 18px; overflow-wrap: anywhere; }
#frames { position: absolute; left: -10000px; top: 0; width: 390px; height: 844px; overflow: hidden; }
#frames iframe { width: 390px; height: 844px; border: 0; }
a { color: var(--info); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Checks</h1>
      <div class="sub" id="mode">Running…</div>
    </div>
    <div class="btns">
      <button type="button" id="copy">Copy report</button>
      <a class="btn" id="toggle" href="check.html?mock=1">Run scenarios</a>
      <a class="btn" href="./">App</a>
    </div>
  </header>
  <div class="summary" id="summary" aria-live="polite">Running checks…</div>
  <div id="groups"></div>
  <pre id="result">CHECK RUNNING</pre>
</div>
<div id="frames" aria-hidden="true"></div>
<script src="testmode.js"></script>
<script type="module" src="check.js?v=7"></script>
</body>
</html>
