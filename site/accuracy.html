<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<title>How accurate is this? · Airports</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<script src="testmode.js"></script>
<style>
:root {
  color-scheme: dark light;
  --bg: #000; --card: #1c1c1e; --card-2: #2c2c2e; --text: #fff; --muted: #a1a1a6; --line: rgba(255, 255, 255, .1);
  --l0: #30d158; --l1: #2ec4d6; --l2: #ffb020; --l3: #ff5a36; --l4: #c04dff; --crit: #ff453a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f2f2f7; --card: #fff; --card-2: #f2f2f7; --text: #000; --muted: #6c6c70; --line: rgba(0, 0, 0, .1);
    --l0: #1f9d43; --l1: #0f8da0; --l2: #b86e00; --l3: #d63a14; --l4: #9a2fd1; --crit: #d70015; }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--text); font: 16px/1.4 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 32px) calc(env(safe-area-inset-left) + 16px); }
a { color: var(--l1); text-decoration: none; }
a:focus-visible { outline: 2px solid var(--l1); outline-offset: 2px; border-radius: 4px; }
.back { display: inline-block; padding: 10px 0; font-size: 16px; font-weight: 600; }
h1 { margin: 2px 0 6px; font-size: 32px; line-height: 1.08; font-weight: 800; letter-spacing: -.03em; }
.lead { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.card { background: var(--card); border-radius: 22px; padding: 16px; margin-bottom: 12px; }
.card h2 { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.big { font-size: 19px; font-weight: 700; line-height: 1.3; margin: 0 0 8px; }
.say { margin: 6px 0; font-size: 15px; }
.say b { font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.banner { background: var(--card); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; border-left: 4px solid var(--l2); }
.status { border-left: 4px solid var(--l0); }
.status.warn { border-left-color: var(--l2); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 6px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { border-top: 0; color: var(--muted); font-weight: 600; font-size: 12.5px; }
td.note { white-space: normal; text-align: left; color: var(--muted); font-size: 12.5px; }
.tablewrap { overflow-x: auto; overscroll-behavior-x: contain; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--font); }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .diag { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; opacity: .7; }
.chart .model { fill: var(--l1); }
.chart .rule { fill: var(--l2); }
.chart .mline { stroke: var(--l1); stroke-width: 2; fill: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14px; }
.bar .track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--card-2); position: relative; overflow: hidden; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--l1); }
.bar .typ { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: .7; }
dl.def { margin: 0; font-size: 14px; }
dl.def dt { font-weight: 700; margin-top: 8px; }
dl.def dd { margin: 2px 0 0; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ Airports</a>
  <h1>How accurate is this?</h1>
  <p class="lead">Every delay chance on this site is checked against what actually happened to flights. Here is the track record.</p>
  <div id="root"><p class="muted">Loading…</p></div>
  <noscript><p class="muted">This page needs JavaScript.</p></noscript>
</div>
<script type="module" src="accuracy.js?v=3"></script>
</body>
</html>
