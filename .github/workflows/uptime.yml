name: Staffing cause candidate QA
on:
  push:
    branches: [qa/staffing-cause-20261010]
permissions:
  contents: read
concurrency:
  group: staffing-cause-qa
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node poller/run-tests.mjs
      - name: Build fixture scenarios and local data
        run: |
          node tools/build-scenarios.mjs
          node poller/poll.mjs --fixtures --out site/data/status.json --raw none
          node poller/poll.mjs --split site/data/status.json
      - name: Check candidate with existing runner Chrome
        run: |
          npm i --no-save --no-audit --no-fund playwright-core@1.48.2
          python3 -m http.server -d site 8000 > qa-server.log 2>&1 &
          node tools/qa-staffing.mjs
      - name: Save browser check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staffing-cause-qa-${{ github.sha }}
          path: |
            qa-evidence/
            qa-server.log
          retention-days: 7
