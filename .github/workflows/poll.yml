name: Poll and deploy

# Only main triggers this; the bot's pushes to the `history` branch don't (GITHUB_TOKEN pushes never
# start workflows anyway).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # push to the history branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test poller/
      # movement hook: the last ADS-B snapshot + baseline (movement/state.json, baseline.json on the history
      # branch) for poller/movement.mjs. Missing files just mean a fresh start; never fails the job.
      - name: Movement state from history
        continue-on-error: true
        timeout-minutes: 2
        run: |
          mkdir -p .cache/movement
          if git fetch -q --depth=1 origin history; then
            for f in state baseline; do
              git show "FETCH_HEAD:movement/$f.json" > ".cache/movement/$f.json" 2>/dev/null || rm -f ".cache/movement/$f.json"
            done
          fi
          ls -l .cache/movement
      # brief hook: the change log's previous state (changes/state.json on the history branch) for
      # poller/changes.mjs. Missing = a fresh start (no events this run); never fails the job.
      - name: Change log state from history
        continue-on-error: true
        timeout-minutes: 2
        run: |
          mkdir -p .cache/changes
          if git fetch -q --depth=1 origin history; then
            git show "FETCH_HEAD:changes/state.json" > .cache/changes/state.json 2>/dev/null || rm -f .cache/changes/state.json
          fi
          ls -l .cache/changes
      # Keep FAA TFR details between runs.
      - name: Flight restriction cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .cache/notices
          key: notices-${{ github.run_id }}
          restore-keys: notices-
      - name: NWS zone geometry cache
        uses: actions/cache@v4
        with:
          path: .cache/nws-zones
          key: nws-zones-${{ github.run_id }}
          restore-keys: nws-zones-
      # Exits 0 unless every source failed, so a partial outage still deploys.
      # Also writes raw response samples to .cache/raw for the history step.
      - name: Poll sources and compute risk
        id: poll
        env:
          # trips hook: the flight calendar link (README "Trips"). Empty when the secret isn't set
          # (trips.json says "not configured"); the poller never logs or publishes it.
          FLIGHTY_ICS_URL: ${{ secrets.FLIGHTY_ICS_URL }}
        run: node poller/poll.mjs
      # brief hook: compare this poll with the previous one -> site/data/changes.json (last 36 h of per-airport
      # events, deployed with the page) and .cache/changes/out (state + this run's events for the history step)
      - name: Change log
        if: ${{ steps.poll.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: node poller/changes.mjs
      - uses: actions/configure-pages@v5
      # Live relay: tell the page where the Cloudflare Worker answers (site/data/config.json), only
      # once its /health is ok; otherwise {"liveUrl":null} (the committed default). Never fails the deploy.
      - name: Live relay URL for the page
        continue-on-error: true
        timeout-minutes: 2
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url=null
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            sub=$(curl -fsS --max-time 20 "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" \
              -H "Authorization: Bearer $CF_API_TOKEN" | jq -r '.result.subdomain // empty') || sub=""
            if [ -z "$sub" ]; then
              echo "::warning::couldn't read the workers.dev subdomain; the page uses the build only"
            elif curl -fsS --max-time 15 "https://airport-wx-live.$sub.workers.dev/health" | jq -e '.ok == true' > /dev/null; then
              url="\"https://airport-wx-live.$sub.workers.dev\""
            else
              echo "::warning::live relay https://airport-wx-live.$sub.workers.dev/health isn't ok (not deployed yet?); the page uses the build only"
            fi
          fi
          echo "{\"liveUrl\":$url}" > site/data/config.json
          cat site/data/config.json
      # The page reads data/summary.json + data/airport/<IATA>.json (README "status.json"); the full build stays
      # unpublished (it carries research-only fields) and is kept for the history step below.
      - name: Keep the full build out of the site
        if: ${{ steps.poll.outcome == 'success' }}
        run: |
          mkdir -p .cache
          mv site/data/status.json .cache/status.json
          ls -l site/data/summary.json; ls site/data/airport | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages sometimes can't see the just-uploaded artifact yet ("No artifacts named
      # github-pages"); wait and try once more before failing the run.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 30
      - id: deployment_retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4

      # ---- History (branch `history`): after the deploy, never fails the job (continue-on-error). ----
      # Runs whenever the poll succeeded, even if the deploy failed.
      # On the very first run the branch doesn't exist, so this checkout fails harmlessly and the
      # next step starts an orphan branch.
      - name: Check out history branch
        if: ${{ !cancelled() && steps.poll.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          ref: history
          path: history
      - name: Prepare history branch
        id: history_prep
        if: ${{ !cancelled() && steps.poll.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: bash poller/history.sh prepare history "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - name: Record history
        if: ${{ !cancelled() && steps.history_prep.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        # the full build (with hubResearch); site/data/status.json if the move above didn't run
        run: node poller/record.mjs history/ --status "$( [ -f .cache/status.json ] && echo .cache/status.json || echo site/data/status.json )"
      # movement hook: state, baseline and this run's log line -> history/movement/ (poller/movement.mjs record)
      - name: Record movement
        if: ${{ !cancelled() && steps.history_prep.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: node poller/movement.mjs record history/
      # brief hook: changes/state.json and this run's events -> history/changes/ (poller/changes.mjs record)
      - name: Record change log
        if: ${{ !cancelled() && steps.history_prep.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: node poller/changes.mjs record history/
      # Pushes whatever was recorded, even if one part of the record step failed.
      - name: Push history
        if: ${{ !cancelled() && steps.history_prep.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: bash poller/history.sh push history
